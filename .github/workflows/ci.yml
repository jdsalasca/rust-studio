name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: >
          cargo clippy --bins -- -D warnings
          -D clippy::unwrap_used
          -D clippy::expect_used
          -D clippy::panic
      - run: cargo test
